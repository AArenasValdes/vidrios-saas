name: Fabricación y cotización

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fabrication-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fabrication-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm fabrication:verify
      - name: Guardar resultados incluso si falla una prueba
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fabrication-verification
          path: test-results/fabrication/
          if-no-files-found: warn
          retention-days: 14
